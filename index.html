<!DOCTYPE html>
<html lang="it">
<!--
  ============================================================
  STRUTTURA DELLA PAGINA (HTML)
  Il file contiene tre parti:
  1. <style>  → l'aspetto grafico (colori, sfondo, spaziature)
  2. <body>   → gli elementi visibili (titolo, campo di testo, lista)
  3. <script> → il comportamento (aggiungere, spuntare, modificare)
  ============================================================
-->
<head>
  <!-- Impostazioni di base: caratteri accentati, adattamento a schermi piccoli e titolo della scheda -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista della spesa</title>

  <!-- ============================================================
       PWA – INSTALLAZIONE SULLA SCHERMATA HOME
       Questi tag dicono al telefono che la pagina è un'app
       installabile e come deve apparire una volta installata.
       ============================================================ -->

  <!-- Il "manifest" è la carta d'identità dell'app: nome, icone, colori
       e modalità standalone (si apre a schermo intero, senza barra del browser) -->
  <link rel="manifest" href="manifest.json">

  <!-- Colore della barra di stato/di sistema, uguale al fondo del sito -->
  <meta name="theme-color" content="#0b0414">

  <!-- Icone: quella SVG per le schede del browser, le PNG per Android -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- Impostazioni specifiche per iPhone/iPad (Safari):
       icona della Home (180×180), apertura a schermo intero,
       barra di stato scura e nome mostrato sotto l'icona -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Spesa">

  <style>
    /* ==========================================================
       VARIABILI DI COLORE
       Qui si definiscono i colori usati in tutta la pagina.
       Per cambiare un colore basta modificarlo in questo punto.
       ========================================================== */
    :root {
      color-scheme: dark;
      --bg: #0b0414;               /* fondo nero/viola */
      --card: rgba(16, 8, 28, 0.9); /* riquadro scuro quasi opaco */
      --text: #f3eeff;
      --muted: #a79bc0;
      --border: rgba(179, 107, 255, 0.28);
      --pink: #ff4fd8;
      --cyan: #00f0ff;
      --yellow: #ffe600;
      --violet: #b36bff;
      --danger: #ff6b8b;
    }

    /* ==========================================================
       AZZERAMENTO E IMPOSTAZIONI GENERALI
       Toglie i margini predefiniti del browser e fa calcolare
       le dimensioni dei box in modo più intuitivo.
       ========================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ==========================================================
       SFONDO A PATTERN PSICHEDELICO
       L'immagine di sfondo è un piccolo disegno SVG (200×200 px)
       scritto direttamente qui dentro e ripetuto a mattonella.
       Contiene funghetti, foglioline e puntini disegnati solo a
       contorno con colori neon e un leggero effetto "bagliore".
       Sotto c'è una sfumatura radiale viola → nero.
       ========================================================== */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      background-color: var(--bg);
      background-image:
        url("data:image/svg+xml,\

        radial-gradient(ellipse at center, #1e0a33 0%, #0b0414 75%);
      background-repeat: repeat, no-repeat;
      background-attachment: fixed, fixed;
    }

    /* ==========================================================
       RIQUADRO CENTRALE (la "scheda" della lista)
       Fondo scuro quasi opaco con sfocatura di ciò che sta dietro,
       bordo sottile e alone neon: così stacca bene dalla trama.
       ========================================================== */
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 0 0 1px rgba(255, 79, 216, 0.08), 0 0 40px rgba(179, 107, 255, 0.25), 0 20px 50px rgba(0, 0, 0, 0.6);
      padding: 28px;
    }

    /* ==========================================================
       INTESTAZIONE: titolo, contatore e suggerimento
       ========================================================== */
    header { margin-bottom: 20px; }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 0 12px rgba(255, 79, 216, 0.45);
    }
    .count { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .hint { color: var(--muted); font-size: 0.8rem; margin-top: 2px; opacity: 0.75; }

    /* ==========================================================
       MODULO DI INSERIMENTO: campo di testo + pulsante "Aggiungi"
       ========================================================== */
    form { display: flex; gap: 8px; margin-bottom: 20px; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.18);
    }

    button.add {
      padding: 0 18px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 79, 216, 0.35);
      transition: filter .15s;
    }
    button.add:hover { filter: brightness(1.12); }

    /* ==========================================================
       ELENCO DEGLI ARTICOLI
       Ogni riga ha: casella di spunta, nome, pulsante elimina.
       ========================================================== */
    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      animation: in .2s ease;
    }
    li:last-child { border-bottom: none; }
    @keyframes in { from { opacity: 0; transform: translateY(-4px); } }

    /* Casella di spunta personalizzata (al posto di quella standard) */
    .check {
      appearance: none;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 2px solid var(--violet);
      border-radius: 6px;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .check:checked {
      background: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }
    .check:checked::after {
      content: "";
      width: 6px;
      height: 11px;
      border: solid #0b0414;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    /* Nome dell'articolo; quando è spuntato diventa grigio e barrato */
    .label {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
      cursor: pointer;
      user-select: none;
      transition: color .15s;
    }
    li.done .label { color: var(--muted); text-decoration: line-through; }

    /* Campo che compare al posto del nome durante la modifica con doppio clic */
    input.edit {
      padding: 6px 10px;
      font-size: 1rem;
    }

    /* Pulsante "×" per eliminare un articolo */
    .delete {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity .15s, color .15s;
    }
    .delete:hover { opacity: 1; color: var(--danger); }

    /* ==========================================================
       MESSAGGIO "LISTA VUOTA" E PIÈ DI PAGINA
       ========================================================== */
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 0;
    }

    footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
    footer button {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    footer button:hover { color: var(--danger); }
    footer button[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- ============================================================
       CONTENUTO VISIBILE
       Tutta la lista sta dentro un unico riquadro (<main class="card">).
       ============================================================ -->
  <main class="card">

    <!-- Intestazione: titolo, contatore degli articoli presi e suggerimento d'uso -->
    <header>
      <h1>🛒 Lista della spesa</h1>
      <p class="count" id="count"></p>
      <p class="hint">Doppio clic su un articolo per modificarlo</p>
    </header>

    <!-- Modulo per aggiungere un nuovo articolo -->
    <form id="form">
      <input type="text" id="input" placeholder="Aggiungi un articolo…" autocomplete="off" autofocus>
      <button type="submit" class="add">Aggiungi</button>
    </form>

    <!-- L'elenco vero e proprio: viene riempito dal JavaScript -->
    <ul id="list"></ul>
    <p class="empty" id="empty">La lista è vuota. Aggiungi il primo articolo!</p>

    <!-- Pulsante che compare solo quando ci sono articoli spuntati -->
    <footer>
      <button id="clear" hidden>Rimuovi articoli spuntati</button>
    </footer>
  </main>

  <script>
    /* ==========================================================
       RIFERIMENTI AGLI ELEMENTI DELLA PAGINA
       Il codice "prende" gli elementi HTML tramite il loro id
       per poterli leggere e modificare.
       ========================================================== */
    const STORAGE_KEY = "lista-spesa";
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");
    const clearBtn = document.getElementById("clear");

    /* ==========================================================
       SALVATAGGIO AUTOMATICO
       La lista viene memorizzata nel browser (localStorage), così
       ritrovi gli articoli anche dopo aver chiuso la pagina.
       Ogni articolo è un oggetto: { id, text, done }.
       ========================================================== */
    let items = load();

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }
    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch {}
    }

    /* ==========================================================
       DISEGNO DELLA LISTA (render)
       Svuota l'elenco e lo ricostruisce da zero partendo
       dall'array "items". Viene chiamata dopo ogni modifica.
       Aggiorna anche il contatore e il messaggio "lista vuota".
       ========================================================== */
    function render() {
      list.innerHTML = "";
      items.forEach(item => {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.className = "check";
        cb.checked = item.done;
        cb.setAttribute("aria-label", "Spunta " + item.text);
        cb.addEventListener("change", () => toggle(item.id));

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item.text;

        // Clic singolo sul nome = spunta (con un piccolo ritardo, per
        // distinguerlo dal doppio clic). Doppio clic = modifica.
        let clickTimer;
        label.addEventListener("click", () => {
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => toggle(item.id), 250);
        });
        label.addEventListener("dblclick", () => {
          clearTimeout(clickTimer);
          startEdit(item, label);
        });

        const del = document.createElement("button");
        del.className = "delete";
        del.title = "Elimina";
        del.setAttribute("aria-label", "Elimina " + item.text);
        del.textContent = "×";
        del.addEventListener("click", () => remove(item.id));

        li.append(cb, label, del);
        list.appendChild(li);
      });

      const total = items.length;
      const done = items.filter(i => i.done).length;
      empty.hidden = total > 0;
      clearBtn.hidden = done === 0;
      count.textContent = total === 0
        ? "Nessun articolo"
        : `${done} di ${total} ${total === 1 ? "articolo preso" : "articoli presi"}`;
    }

    /* ==========================================================
       AZIONI SUGLI ARTICOLI
       add    → aggiunge un nuovo articolo in fondo
       toggle → spunta / toglie la spunta
       remove → elimina un articolo
       Ognuna salva e poi ridisegna la lista.
       ========================================================== */
    function add(text) {
      items.push({ id: Date.now() + Math.random().toString(16).slice(2), text, done: false });
      save(); render();
    }
    function toggle(id) {
      const item = items.find(i => i.id === id);
      if (item) item.done = !item.done;
      save(); render();
    }
    function remove(id) {
      items = items.filter(i => i.id !== id);
      save(); render();
    }

    /* ==========================================================
       MODIFICA RAPIDA CON DOPPIO CLIC
       Sostituisce il nome con un campo di testo già compilato.
       - Invio o clic fuori → salva il nuovo testo
       - Esc               → annulla e rimette il testo originale
       Se il campo viene lasciato vuoto, il nome resta quello di prima.
       ========================================================== */
    function startEdit(item, label) {
      const field = document.createElement("input");
      field.type = "text";
      field.className = "edit";
      field.value = item.text;
      field.setAttribute("aria-label", "Modifica articolo");
      label.replaceWith(field);
      field.focus();
      field.select();

      let finished = false; // evita di salvare due volte (Invio + perdita del focus)
      function finish(keep) {
        if (finished) return;
        finished = true;
        const text = field.value.trim();
        if (keep && text) {
          item.text = text;
          save();
        }
        render();
      }

      field.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        else if (e.key === "Escape") { finish(false); }
      });
      field.addEventListener("blur", () => finish(true));
    }

    /* ==========================================================
       EVENTI DEI CONTROLLI PRINCIPALI
       - Invio del modulo: aggiunge l'articolo scritto
       - Pulsante in fondo: rimuove tutti gli articoli spuntati
       ========================================================== */
    form.addEventListener("submit", e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text);
      input.value = "";
      input.focus();
    });

    clearBtn.addEventListener("click", () => {
      items = items.filter(i => !i.done);
      save(); render();
    });

    /* ==========================================================
       AVVIO
       Disegna la lista appena la pagina si apre.
       ========================================================== */
    render();

    /* ==========================================================
       PWA – REGISTRAZIONE DEL SERVICE WORKER
       Il service worker (file service-worker.js) salva in memoria
       tutti i file dell'app, così si apre anche senza internet.
       Funziona solo quando il sito è pubblicato in https (o su
       localhost): aprendo il file con doppio clic dal computer
       (indirizzo file://) viene saltato e la lista funziona lo stesso.
       La registrazione avviene dopo il caricamento della pagina,
       per non rallentare la prima apertura.
       ========================================================== */
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(err => console.warn("Service worker non registrato:", err));
      });
    }
  </script>
</body>
</html>
